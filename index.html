<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icon-180.png">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rammetto+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Barlow+Condensed:wght@500;700&display=swap">
<style>
/* Layout: one column, phone first; the square board is the hero, the dice and actions sit in its middle.
   A single committed look: Spessart forest felt, Buntsandstein red, parchment fields. */
:root{
  --forest:#173b2c; --forest-2:#21503c; --forest-3:#2c6249;
  --paper:#f3ead6; --paper-2:#e6d9bb; --ink:#1f1b15; --muted:#6e6655;
  --sand:#b6472e; --sand-2:#d9674b; --gold:#e6b43d; --cream-on-forest:#efe6cf; --dim-on-forest:#a9bfae;
  --good:#3f9b5f; --bad:#c2402b;
  --g-br:#7b4a28; --g-hb:#86c3e6; --g-pk:#d55a98; --g-or:#e8892a; --g-rt:#d63a35; --g-li:#8e4fc4; --g-ge:#efcd36; --g-gr:#2f9b55; --g-db:#26428f;
  --f-display:"Rammetto One", "Arial Black", system-ui, sans-serif;
  --f-body:"Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-board:"Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  color-scheme: dark;
}
html,body{background:var(--forest);color:var(--cream-on-forest)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
[hidden]{display:none!important}
.wrap{max-width:600px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,7.4vw,40px);line-height:1.05;letter-spacing:.01em;color:var(--paper)}
h1 span{color:var(--gold)}
h2{font-family:var(--f-display);font-weight:400;font-size:19px;color:var(--paper)}
.eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--dim-on-forest);font-weight:600}
.lead{color:var(--dim-on-forest);max-width:60ch;margin:0}
.panel{background:var(--forest-2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:11px 16px;font-weight:700;background:var(--paper);color:var(--ink)}
button.primary{background:var(--sand);color:#fff7ec}
button.gold{background:var(--gold);color:var(--ink)}
button.ghost{background:transparent;color:var(--cream-on-forest);border:1.5px solid var(--forest-3)}
button.small{padding:7px 11px;font-size:13px;border-radius:8px}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
input,select{font:inherit;padding:10px 12px;border-radius:9px;border:1.5px solid var(--forest-3);background:var(--forest);color:var(--cream-on-forest);min-width:0}
label{font-size:13px;color:var(--dim-on-forest);display:flex;flex-direction:column;gap:5px;flex:1 1 140px;min-width:0}
.big-choice{display:grid;grid-template-columns:1fr;gap:10px}
.big-choice button{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.big-choice small{font-weight:400;opacity:.8;font-size:13px}
.note{font-size:13px;color:var(--dim-on-forest)}
.err{color:#ffb4a3;font-size:13.5px}
.code{font-family:var(--f-display);font-size:30px;letter-spacing:.18em;color:var(--gold)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none;box-shadow:0 0 0 2px rgba(0,0,0,.25)}

/* board */
.board{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));grid-template-rows:repeat(9,minmax(0,1fr));aspect-ratio:10/9;width:100%;max-width:100%;gap:2px;background:var(--forest-3);padding:2px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cell{background:var(--paper);color:var(--ink);position:relative;overflow:hidden;display:flex;flex-direction:column;font-family:var(--f-board);border-radius:3px;cursor:pointer;min-width:0;min-height:0;padding:0}
.cell .strip{height:20%;min-height:6px;display:flex;gap:2px;align-items:center;justify-content:center}
.cell .strip i.hotel{width:12px;background:#c8102e}
.cell .strip i{width:5px;height:5px;background:#fff;border:1px solid rgba(0,0,0,.5);display:block}
.cell .nm{font-weight:700;font-size:clamp(7.5px,2.05vw,11.5px);line-height:1.02;padding:2px 2px 0;hyphens:manual;overflow-wrap:anywhere;text-align:center}
.cell .pr{font-size:clamp(7px,1.8vw,10.5px);color:var(--muted);text-align:center;margin-top:auto;padding-bottom:2px;font-variant-numeric:tabular-nums}
.cell .ic{text-align:center;font-size:clamp(13px,4.2vw,22px);line-height:1.15;margin-top:1px;filter:drop-shadow(0 1px 0 rgba(0,0,0,.15))}
.board .nm{display:none}
.board.zoom .nm{display:block}
@media (min-width:620px){.board .nm{display:block}.cell .ic{font-size:18px}}
.board.zoom{width:860px;max-width:none}
.board.zoom .cell .ic{font-size:22px}
.board.zoom .cell .nm{font-size:11px}
.boardwrap{overflow:auto;max-width:100%;border-radius:12px;-webkit-overflow-scrolling:touch}
.avatar{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:14px;box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 4px rgba(0,0,0,.4);flex:none}
.avatar.big{width:42px;height:42px;font-size:24px}
.avatar svg,.av svg{width:86%;height:86%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.45))}
.toks{display:flex;gap:6px;flex-wrap:wrap}
.toks button{width:46px;height:46px;padding:5px;border-radius:12px;background:var(--forest);border:2px solid transparent}
.toks button.on{border-color:var(--gold);background:var(--forest-3)}
.toks button:disabled{opacity:.25}
.toks svg{width:100%;height:100%}
.tokname{font-size:12px;color:var(--dim-on-forest)}
@keyframes ember{50%{opacity:.45}}@keyframes smoke{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-2px);opacity:.2}}
.ember{animation:ember 1.1s ease-in-out infinite}.smoke{animation:smoke 1.6s ease-in-out infinite alternate}
@media (prefers-reduced-motion:reduce){.ember,.smoke{animation:none}}
.chk{flex-direction:row;align-items:center;gap:8px;color:var(--cream-on-forest);font-size:14px}
.chk input{width:18px;height:18px;min-width:18px}
.chk .sw{width:14px;height:10px;border-radius:2px;flex:none}
.trade{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.trade h3{font-size:14px;color:var(--gold)}
.float{position:absolute;right:12px;top:8px;font-weight:800;font-size:16px;pointer-events:none;animation:floatUp 1.5s ease-out forwards;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.float.plus{color:#8ff0a0}.float.minus{color:#ffa08c}
@keyframes floatUp{0%{opacity:0;transform:translateY(6px) scale(.8)}15%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-34px) scale(1)}}
.pl{position:relative;overflow:hidden}
#banner{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:8}
#banner span{font-family:var(--f-display);font-size:clamp(34px,11vw,72px);color:var(--gold);text-shadow:0 4px 0 var(--sand),0 10px 30px rgba(0,0,0,.6);animation:bannerPop 1.5s ease forwards;text-align:center;padding-inline:16px}
@keyframes bannerPop{0%{opacity:0;transform:scale(.3) rotate(-12deg)}18%{opacity:1;transform:scale(1.15) rotate(3deg)}30%{transform:scale(1) rotate(0)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) translateY(-20px)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:7;overflow:hidden}
#confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall 3.2s linear forwards}
@keyframes fall{to{top:105%;transform:translateX(40px) rotate(720deg)}}
#mybar{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;align-items:center;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,var(--forest-2),var(--forest));border-top:2px solid var(--gold);box-shadow:0 -8px 24px rgba(0,0,0,.35)}
#mybar .who{display:flex;flex-direction:column;min-width:0;flex:1}
#mybar .who b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mybar .who span{font-size:12px;color:var(--dim-on-forest)}
#mybar .bal{font-family:var(--f-display);font-size:clamp(20px,6.5vw,28px);color:var(--gold);font-variant-numeric:tabular-nums}
body.has-bar .wrap{padding-bottom:96px}
body.has-bar .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.dice.tumble span{display:inline-block;animation:tumble .18s linear infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}50%{transform:rotate(180deg) translateY(-6px)}100%{transform:rotate(360deg) translateY(0)}}
.card.flip{animation:flipIn .55s cubic-bezier(.2,.8,.3,1.2)}
@keyframes flipIn{0%{transform:perspective(600px) rotateY(90deg) scale(.8);opacity:0}100%{transform:perspective(600px) rotateY(0) scale(1);opacity:1}}
.card.trade{border-top-color:var(--g-li)}
.cell.corner{background:var(--paper-2)}
.cell.owned::after{content:"";position:absolute;right:2px;top:22%;width:7px;height:7px;border-radius:50%;background:var(--own)}
.cell.sel{outline:3px solid var(--gold);outline-offset:-3px;z-index:1}
.cell .tok{position:absolute;left:2px;bottom:2px;display:flex;flex-wrap:wrap;gap:1px;max-width:90%}
.cell .tok b{width:clamp(12px,3.6vw,20px);height:clamp(12px,3.6vw,20px);border-radius:50%;border:1.5px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;font-size:clamp(7px,2.2vw,12px);transition:transform .15s}
.cell .tok b.now{animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-3px)}}
.center{grid-row:2/9;grid-column:2/10;position:relative;isolation:isolate;background:repeating-radial-gradient(circle at 70% 25%,transparent 0 14px,rgba(239,230,207,.05) 14px 15px),radial-gradient(circle at 50% 35%,var(--forest-3),var(--forest) 75%);border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;overflow:auto;min-width:0;min-height:0}
.center .wm{position:absolute;inset:8% 18%;z-index:-1;opacity:.13;display:flex;align-items:center;justify-content:center;pointer-events:none}
.center .wm svg{height:100%;width:auto}
.crest svg{display:block;width:100%;height:auto;filter:drop-shadow(0 3px 6px rgba(0,0,0,.45))}
.center .crest{width:clamp(34px,11vw,64px);flex:none}
@media (max-width:600px){.center:has(.card) .crest{display:none}}
.crest.hd{width:clamp(48px,14vw,72px);flex:none}
.mg{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.mg button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.track{position:relative;width:min(100%,260px);height:44px;border-radius:22px;background:repeating-linear-gradient(90deg,#3c6b3f 0 18px,#35603a 18px 36px);border:2px solid #6b4a2a;overflow:hidden}
.track .runner{position:absolute;top:4px;font-size:28px;transform:scaleX(-1);transition:left .08s linear}
.track .flag{position:absolute;right:6px;top:8px;font-size:22px}
.feet{display:flex;gap:10px}.feet button{min-width:110px;padding:14px 10px;font-size:16px}.feet button.used{opacity:.55;transform:scale(.96)}
.tree{position:relative;width:min(100%,270px);height:190px;border-radius:14px;background:linear-gradient(#1e3d27,#173020 70%,#4a3520 70%);overflow:hidden;touch-action:manipulation}
.tree .crown{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:70px;opacity:.55;pointer-events:none}
.tree.splat{animation:splat .25s}@keyframes splat{50%{background-color:#5a2a1a}}
.apple{position:absolute;top:-8px;width:46px;height:46px;padding:0;border:0;background:none;font-size:32px;line-height:46px;animation:fall 1.8s linear forwards;touch-action:manipulation}
.apple.caught{animation:none;transform:scale(1.4);transition:transform .2s}
@keyframes fall{from{transform:translateY(0) rotate(0)}to{transform:translateY(150px) rotate(200deg)}}
.bells{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;width:min(100%,150px)}
.bells button{aspect-ratio:1/1;font-size:26px;border-radius:50%;background:radial-gradient(circle at 40% 35%,color-mix(in srgb,var(--bell) 70%,white),var(--bell));border:3px solid rgba(0,0,0,.35);opacity:.8;padding:0}
.bells button:disabled{opacity:.55}
.bells button.ring{animation:ring .42s ease;opacity:1;box-shadow:0 0 22px var(--bell)}
.bells button.wrong{background:#555}
@keyframes ring{0%{transform:scale(1) rotate(0)}30%{transform:scale(1.15) rotate(-14deg)}60%{transform:scale(1.1) rotate(12deg)}100%{transform:scale(1) rotate(0)}}
@media (prefers-reduced-motion:reduce){.apple{animation-duration:3s!important}.bells button.ring{animation:none}}
.gtop{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}
.gtop .eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.gbtns{display:flex;gap:6px;flex:none}
.gbtns button{padding:7px 10px;font-size:14px}
.panel.quit{border:2px solid var(--gold)}
.acts2{display:flex;flex-wrap:wrap;gap:8px}
.abortnote{align-self:stretch;border:1.5px dashed var(--gold)!important}
.pl.out .money{text-decoration:line-through;opacity:.6}
html{-webkit-text-size-adjust:100%}
body{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
@media (max-width:600px){
  .wrap{padding-inline:8px;gap:10px;padding-top:calc(8px + env(safe-area-inset-top,0px))}
  #app{padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .board{gap:1.5px;padding:1.5px;border-radius:10px}
  #app .players{grid-template-columns:repeat(auto-fit,minmax(84px,1fr))}
  .center .crest,.center .mark{display:none}
  .center .dice span{font-size:clamp(26px,9vw,40px)}
  #mybar{padding:7px 12px calc(7px + env(safe-area-inset-bottom,0px));gap:10px}
  #mybar .avatar.big{width:34px;height:34px}
  #mybar .bal{font-size:22px}
  #mybar .who b{font-size:14px}
  input,select{font-size:16px}
  .panel{padding:14px}
  .center{padding:5px;gap:4px}
}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;padding:8px 10px;font-size:13px;background:transparent;border:1px solid var(--line,rgba(255,255,255,.2));color:inherit}.tabs button.on{background:var(--gold);color:#1b1b1b;border-color:var(--gold)}
.card.ev{border-top-color:#ff9f1c;box-shadow:0 0 0 2px rgba(255,159,28,.35)}
.evbar{margin:0 0 8px;padding:6px 12px;border-radius:10px;background:#ff9f1c;color:#1b1b1b;font-size:12.5px;line-height:1.3;animation:pop .4s ease}
.chart{margin:6px 0 12px;background:var(--forest);border-radius:12px;padding:10px}
.chart svg{width:100%;height:auto;display:block}
.chart figcaption{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--dim-on-forest);margin-top:6px}
.chart figcaption i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.aw{display:flex;gap:10px;align-items:center;background:var(--forest);border-radius:12px;padding:9px 12px;animation:pop .5s ease both}
.aw .ai{font-size:26px}.aw b{display:block;color:var(--gold);font-size:14px}.aw span{font-size:13px}
.aw .dot{display:inline-block;width:9px;height:9px;margin-right:5px}
.achp summary{cursor:pointer;list-style:none}.achp summary::-webkit-details-marker{display:none}
.achp summary h2{display:flex;justify-content:space-between;align-items:center;margin:0}.achn{font-size:14px;color:var(--gold)}
.achgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-top:12px}
.achi{display:flex;flex-direction:column;gap:2px;background:var(--forest);border-radius:12px;padding:10px;opacity:.55}
.achi.on{opacity:1;box-shadow:inset 0 0 0 1px var(--gold)}.achi span{font-size:24px}.achi b{font-size:13px}.achi small{font-size:11px;color:var(--dim-on-forest)}
.achtoast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:30;display:flex;gap:10px;align-items:center;background:var(--paper);color:var(--ink);padding:10px 16px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);border:2px solid var(--gold);animation:achin .45s cubic-bezier(.2,1.4,.4,1);transition:opacity .5s,transform .5s}
.achtoast span{font-size:30px}.achtoast small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}.achtoast b{font-size:15px}
.achtoast.out{opacity:0;transform:translate(-50%,-20px)}
@keyframes achin{from{transform:translate(-50%,-40px) scale(.8);opacity:0}}
.bubble{position:absolute;transform:translate(-50%,0);z-index:25;max-width:220px;background:var(--paper);color:var(--ink);font-size:13px;font-weight:600;padding:7px 11px;border-radius:14px;box-shadow:0 6px 18px rgba(0,0,0,.4);pointer-events:none;animation:achin2 .3s ease;transition:opacity .4s}
.bubble::after{content:"";position:absolute;left:50%;top:-7px;margin-left:-7px;border:7px solid transparent;border-top:0;border-bottom-color:var(--paper)}
.bubble.out{opacity:0}
@keyframes achin2{from{opacity:0;transform:translate(-50%,10px)}}
.news{border:2px solid var(--gold)}.news ul{margin:6px 0 10px;padding-left:4px;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:14px}
.countdown{display:flex;flex-direction:column;align-items:center;gap:4px}
.countdown span{font-family:var(--f-display);font-size:clamp(56px,20vw,96px);color:var(--gold);line-height:1;animation:pop .6s ease}
.countdown small{color:var(--dim-on-forest);font-size:12px}
.whack button.boar.gold{background:radial-gradient(circle at 50% 60%,#f2c230 0 45%,#b8860b 46% 100%);box-shadow:0 0 14px #f2c230}
.whack button.boar.freddy{background:radial-gradient(circle at 50% 60%,#3a4a6a 0 45%,#2a3550 46% 100%)}
.mgfloat{position:fixed;transform:translate(-50%,-10px);font-weight:800;color:#7dff9a;pointer-events:none;z-index:9;animation:mgfloat .7s ease forwards;text-shadow:0 2px 4px rgba(0,0,0,.6)}
.mgfloat.bad{color:#ff7a6a}
@keyframes mgfloat{to{transform:translate(-50%,-46px);opacity:0}}
.quip{font-size:12px;font-style:italic;color:var(--gold);opacity:.9;max-width:92%}
.whack{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(100%,190px)}
.whack button{aspect-ratio:1/1;font-size:30px;padding:0;border-radius:50%;background:radial-gradient(circle at 50% 60%,#1d140b 0 45%,#4a3520 46% 100%);border:2px solid #6b4a2a}
.whack button.boar{background:radial-gradient(circle at 50% 60%,#5a3d22 0 45%,#7a5530 46% 100%);animation:pop .25s ease}
.bigq{font-family:var(--f-display);font-size:clamp(24px,8vw,38px);color:var(--paper);font-variant-numeric:tabular-nums;line-height:1.1}
.center:has(#mg-area) .crest,.center:has(#mg-area) .mark,.center:has(#mg-area) .dice,.center:has(#mg-area) .turnchip,.center:has(#mg-area) .card,.center:has(#mg-area) .msg,.center:has(#mg-area) .quip{display:none}
.center .mark{font-family:var(--f-display);font-size:clamp(12px,3.4vw,18px);color:var(--gold);line-height:1}

  const A=S.players[t.from],B=S.players[t.to];S.trade=null;S.phase=t.prev;
  const ok=t.give.props.every(i=>S.props[i]&&S.props[i].owner===A.id&&!S.props[i].h)&&t.get.props.every(i=>S.props[i]&&S.props[i].owner===B.id&&!S.props[i].h)&&A.money>=t.give.money&&B.money>=t.get.money;
  if(!yes||!ok){log(S,B.name+" lehnt den Tausch ab.");S.card={deck:"trade",t:"Abgelehnt",x:B.name+" will nicht. Kilian legt die Akte zu."};return S;}
  t.give.props.forEach(i=>S.props[i].owner=B.id);t.get.props.forEach(i=>S.props[i].owner=A.id);
  A.money+=t.get.money-t.give.money;B.money+=t.give.money-t.get.money;
  log(S,"Kilian beglaubigt den Tausch: "+A.name+" gibt "+tradeDesc(S,t.give)+", "+B.name+" gibt "+tradeDesc(S,t.get)+".");
  S.card={deck:"trade",t:"🏛️ Getauscht!",x:"Kilian stempelt ab. "+A.name+" zahlt 10 € Gebühr."};
  pay(S,A,null,10);if(S.status==="playing"&&cur(S).bankrupt)S.phase="end";return S;
}
function worth(S,p){if(p.bankrupt)return 0;let w=p.money;Object.keys(S.props).forEach(i=>{const o=S.props[i];if(o.owner===p.id)w+=BOARD[i].p+o.h*houseCost(BOARD[i]);});return w;}
/* Aussteigen: Straßen des Spielers werden frei (Häuser weg), er scheidet aus. */
function actQuit(S,pid){
  const p=S.players[pid];if(S.status!=="playing"||!p||p.bankrupt)return S;
  if(S.duel&&(S.duel.from===pid||S.duel.to===pid)){const d=S.duel;S.duel=null;S.phase=d.prev;}
  if(S.trade&&(S.trade.from===pid||S.trade.to===pid)){const t=S.trade;S.trade=null;S.phase=t.prev;}
  Object.keys(S.props).forEach(i=>{if(S.props[i].owner===pid)delete S.props[i];});
  p.bankrupt=true;p.left=true;p.bankruptAt=++S.seq;p.money=0;p.jail=false;p.skip=0;p.sleep=0;
  if(S.abort)delete S.abort[pid];
  log(S,p.name+" steigt aus. Seine Straßen sind wieder frei.");
  const rest=alive(S);
  if(!rest.length){S.unranked=true;finish(S);return S;}
  if(rest.length===1){finish(S);return S;}
  if(abortReady(S))return S;
  if(S.turn===pid){S.challenge=null;S.wantBuy=false;S.phase="end";actEnd(S);}
  return S;
}
/* Abbruch für alle: zählt nicht für die Rangliste, sobald alle Übrigen zustimmen. */
function abortReady(S){const rest=alive(S);if(rest.length&&rest.every(p=>S.abort&&S.abort[p.id])){S.unranked=true;S.duel=null;S.trade=null;log(S,"Alle wollen aufhören. Das Spiel wird beendet und zählt nicht.");finish(S);return true;}return false;}
function actAbortVote(S,pid,yes){
  if(S.status!=="playing"||!S.players[pid]||S.players[pid].bankrupt)return S;
  S.abort=S.abort||{};if(yes){S.abort[pid]=true;log(S,S.players[pid].name+" will das Spiel beenden.");}else delete S.abort[pid];
  abortReady(S);return S;
}
function actAbortAll(S){if(S.status!=="playing")return S;S.abort={};alive(S).forEach(p=>S.abort[p.id]=true);abortReady(S);return S;}
function finish(S){
  S.hist=S.hist||[];S.hist.push(S.players.map(q=>worth(S,q)));
  S.status="over";S.phase="over";S.finishedAt=Date.now();
  const r=S.players.map(p=>({id:p.id,name:p.name,cpu:!!p.cpu,color:p.color,worth:worth(S,p),bankrupt:p.bankrupt,left:!!p.left,ba:p.bankruptAt}));
  r.sort((a,b)=>(a.bankrupt-b.bankrupt)||(a.bankrupt?b.ba-a.ba:b.worth-a.worth));
  S.ranking=r.map((x,i)=>Object.assign(x,{place:i+1}));
  if(!S.unranked)log(S,"Spielende! "+S.ranking[0].name+" ist der neue Rottenberg-Baron.");
}

function autoPass(S){

/* ---------- Computergegner ----------
   Die Bots spielen nur, wenn ein Mensch zuschaut (app.mode local, Spiel vsCpu). Jede Entscheidung ist ein normaler Spielzug. */
function cpuActor(S){
  if(!S||!S.vsCpu||S.status!=="playing")return null;
  const P=id=>S.players[id]&&S.players[id].cpu?id:null;
  if(S.phase==="duel"&&S.duel){const d=S.duel;if(d.state==="ask")return P(d.to);if(d.state==="play"){const id=miniPending(d).find(id=>S.players[id].cpu);return id??null;}return P(d.from);}
  if(S.phase==="trade"&&S.trade)return P(S.trade.to);
  return P(S.turn);
}
function cpuKick(){
  clearTimeout(app.cpuT);app.cpuT=null;const S=app.S;
  if(app.mode!=="local"||app.screen!=="game"||mg)return;
  const id=cpuActor(S);if(id==null)return;
  const wait=S.phase==="roll"?(S.card?1700:1000):S.phase==="duel"?1300:900;
  app.cpuT=setTimeout(()=>{app.cpuT=null;if(app.S!==S||mg)return;cpuCommit(T=>cpuMove(T,id));},wait);
}
function cpuCommit(fn){
  const next=autoPass(fn(JSON.parse(JSON.stringify(app.S))));next.rev=(next.rev||0)+1;
  app.S=next;render();store.set("rbm-local",next);if(next.status==="over")saveResult(next);
}
/* Wie gut ein Bot ein Minispiel spielt. Stärke 1 bis 3, mit Streuung, damit jedes Duell offen bleibt. */
function cpuScore(kind,lvl,q){
  const g=()=>{let x=0;for(let i=0;i<4;i++)x+=Math.random();return (x-2)/1.15;},s=[0,.3,.55,.8][lvl]||.55;
  const n=(base,span,sd)=>Math.max(0,Math.round(base+span*s+sd*g()));
  if(kind==="whack")return n(7,13,3);
  if(kind==="rennen")return n(28,32,5);
  if(kind==="faengt")return n(7,11,2.5);
  if(kind==="glocken")return Math.max(1,n(2,7,1.3));
  if(kind==="rechnen")return Math.round(4+10*s+3*g());
  if(kind==="farben")return Math.round(5+11*s+3*g());
  if(kind==="stopp")return Math.max(1500,Math.round(5000+(900-800*s)*g()));
  if(kind==="schaetz"){const a=SCHAETZ[q].a;return Math.max(0,Math.round(a*(1+(.45-.35*s)*g())));}
  return 0;
}
function cpuValue(S,i){const f=BOARD[i];let v=f.p;if(f.g){const grp=BOARD.map((b,j)=>b.g===f.g?j:-1).filter(j=>j>=0);const own=grp.filter(j=>S.props[j]&&S.props[j].owner===S.props[i]?.owner).length;v*=1+own/grp.length;}return v;}
function cpuMove(S,id){
  const me=S.players[id],lvl=S.cpuLvl||2,reserve=[0,90,150,220][lvl];
  if(S.phase==="duel"&&S.duel){const d=S.duel;
    if(d.state==="ask")return actDuelAnswer(S,Math.random()<(d.stake>me.money*.4?.45:.85));
    if(d.state==="play")return actDuelInput(S,id,cpuScore(d.kind,lvl,d.q));
    return S;}
  if(S.phase==="trade"&&S.trade){const t=S.trade;
    const val=(l,pid)=>l.props.reduce((a,i)=>a+BOARD[i].p*(BOARD[i].g&&wouldComplete(S,i,pid)?2.5:1),0)+l.money;
    const get=val(t.give,id),give=val(t.get,t.from);
    return actTradeAnswer(S,get>=give*([0,1.05,1.25,1.5][lvl])+20);}
  if(id!==S.turn)return S;
  if(S.phase==="roll"){
    if(cpuOffer(S,me,lvl,reserve))return S;
    cpuBuild(S,me,reserve);
    if(canDuel(S)&&cpuDuel(S,me,lvl))return S;
    if(me.jail&&me.jailCards&&S.round<12)return actRoll(actJailCard(S));
    if(me.jail&&me.money>reserve+200&&S.round<12)actJailPay(S);
    return actRoll(S);}
  if(S.phase==="buy"){const f=BOARD[me.pos],key=f.g&&wouldComplete(S,me.pos,me.id);return (me.money-f.p>=reserve*(key?.3:1)||(key&&me.money>=f.p))?actBuy(S):actSkip(S);}
  if(S.phase==="challenge"&&S.challenge)return actChallenge(S,cpuScore(S.challenge.kind,lvl,S.challenge.q));
  if(S.phase==="penalty")return actPenalty(S,pick(["links","Mitte","rechts"]));
  if(S.phase==="end"){cpuBuild(S,me,reserve);if(canDuel(S)&&cpuDuel(S,me,lvl))return S;return actEnd(S);}
  return S;
}
/* Fehlt einem Bot genau eine Straße zur Farbgruppe und hat sie der Mensch, macht er ein Kaufangebot (höchstens alle 4 Runden). */
function cpuOffer(S,me,lvl,reserve){
  S.botTr=S.botTr||{};if(S.trade||S.duel||(S.botTr[me.id]??-99)>S.round-4)return false;
  const human=S.players.find(q=>!q.cpu&&!q.bankrupt);if(!human)return false;
  for(const g of Object.keys(GROUPS)){
    const idx=BOARD.map((f,j)=>f.g===g?j:-1).filter(j=>j>=0);if(idx.some(j=>S.props[j]&&S.props[j].h))continue;
    const mine=idx.filter(j=>S.props[j]&&S.props[j].owner===me.id),theirs=idx.filter(j=>S.props[j]&&S.props[j].owner===human.id);
    if(mine.length!==idx.length-1||theirs.length!==1)continue;
    const i=theirs[0],offer=Math.round(BOARD[i].p*(1.3+.25*lvl)/10)*10;if(me.money-offer<reserve)continue;
    S.botTr[me.id]=S.round;actTradeStart(S,human.id,{props:[],money:offer},{props:[i],money:0});return S.phase==="trade";
  }
  return false;
}
function wouldComplete(S,i,pid){const g=BOARD[i].g;return !!g&&BOARD.every((f,j)=>f.g!==g||j===+i||(S.props[j]&&S.props[j].owner===pid));}
/* Bauen: gleichmäßig auf vollen Gruppen, aber immer mit Notgroschen. */
function cpuBuild(S,me,reserve){
  for(let k=0;k<12;k++){
    const opts=Object.keys(S.props).map(Number).filter(i=>{const o=S.props[i],f=BOARD[i];return o.owner===me.id&&f.t==="prop"&&o.h<MAXH&&ownsGroup(S,me.id,f.g)&&me.money-houseCost(f)>=reserve+60;});
    if(!opts.length)return;
    opts.sort((a,b)=>S.props[a].h-S.props[b].h||BOARD[b].p-BOARD[a].p);actBuild(S,opts[0]);
  }
}
function cpuDuel(S,me,lvl){
  if(Math.random()>[0,.35,.55,.7][lvl])return false;
  const os=others(S,me).filter(o=>o.money>=20);if(!os.length)return false;
  const human=os.find(o=>!o.cpu),o=human&&Math.random()<.75?human:pick(os);
  const stake=Math.min(200,Math.max(20,Math.round(Math.min(me.money,o.money)*.12/10)*10));
  actDuelStart(S,o.id,stake,pick(OFFER));return S.phase==="duel";
}

function awards(S){

  if(big&&big.a.mxf>=0&&S.players[big.a.mxto])out.unshift({ic:"💥",t:"Teuerster Moment",who:big.p,txt:"zahlte "+fmt(big.a.mx)+" € an "+S.players[big.a.mxto].name+" für "+BOARD[big.a.mxf].n});

function chartSVG(S){

  const rows=[S.players.map(()=>1500),...H],W=320,Ht=130,all=rows.flat(),max=Math.max(...all),min=Math.min(...all),span=Math.max(1,max-min),n=rows.length-1;

}

function botTalk(S,lines){
  if(!S.vsCpu||Date.now()-(app.lastSay||0)<2200)return;
  for(const line of lines)for(const b of S.players){
    if(!b.cpu||b.bankrupt||!BOT_SAY[b.name])continue;const n=b.name;let k=null;
    if(line.startsWith(n+" schlägt"))k="offer";
    else if(line.startsWith(n+" kauft "))k="buy";
    else if(line.startsWith(n+" baut "))k="build";
    else if(line.startsWith(n+" sitzt im Bunker"))k="jail";
    else if(line.includes(" Miete an "+n+"."))k="rentIn";
    else if(line.startsWith(n+" zahlt ")&&line.includes(" Miete an "))k="rentOut";
    else if(/: .* gewinnt \d+ €/.test(line)&&line.includes(n))k=line.includes(": "+n+" gewinnt")?"duelWin":"duelLose";
    if(!k||(k!=="offer"&&Math.random()<.35))continue;
    app.lastSay=Date.now();bubble(b.id,pick(BOT_SAY[n][k]));return;
  }
}

function fieldSheet(i){

  let body="";
  if(f.t==="prop"){body=`<table><tr><td>Kaufpreis</td><td>${f.p} €</td></tr><tr><td>Miete</td><td>${f.r[0]} € (ganze Gruppe ${f.r[0]*2} €)</td></tr>${[1,2,3,4].map(h=>`<tr><td>mit ${h} ${h>1?"Häusern":"Haus"}</td><td>${fmt(f.r[h])} €</td></tr>`).join("")}<tr><td>mit Hotel</td><td>${fmt(f.r[5])} €</td></tr><tr><td>Haus oder Hotel bauen</td><td>je ${houseCost(f)} €</td></tr></table>`;}

  else body=`<p class="note">${{start:"Über Los gibt es 200 €, genau drauf 400 €.",klatsch:"Ziehe eine Dorfklatsch-Karte.",wahn:"Ziehe eine Spessart-Wahnsinn-Karte. Hier wird es verrückt.",tax:"Zahle "+f.a+" € in die Kasse im Biergarten.",jail:"Nur zu Besuch, oder du sitzt bei Big A im Bunker fest. Dort wird gemeinsam einer geraucht. Raus mit Pasch, 50 € oder Freikarte.",pot:"Frei Parken: Wer hier landet, nimmt die ganze Kasse mit, gerade "+S.pot+" €.",loewe:"Tadan! Du gibst Freddy, der Dorflegende, einen aus: 10 € in die Kasse im Biergarten.",gojail:"Direkt in den Bunker bei Big A, kein Geld über Los."}[f.t]}</p>`;
  let own="";

  else if(ownable(f))own=`<p class="note">Noch zu haben.</p>`;
  let acts="";
  if(o&&f.t==="prop"&&canAct()&&o.owner===cur(S).id){
    const p=cur(S),full=ownsGroup(S,p.id,f.g);
    acts=`<div class="row"><button class="primary small" data-a="build" data-i="${i}" ${!full||o.h>=MAXH||p.money<houseCost(f)||S.phase==="buy"?"disabled":""}>${o.h===MAXH-1?"Hotel":"Haus"} bauen (${houseCost(f)})</button><button class="ghost small" data-a="sell" data-i="${i}" ${o.h<1?"disabled":""}>Haus verkaufen (+${houseCost(f)/2})</button></div>${full?"":`<p class="note">Bauen geht erst, wenn dir die ganze Gruppe ${grp.n} gehört.</p>`}`;
  }
  return `<section class="sheet">${grp?`<div class="bar" style="background:${grp.c}"></div>`:""}<div class="row" style="justify-content:space-between"><h3>${esc(f.n)}</h3><button class="ghost small" data-a="unsel">Schließen</button></div>${own}${f.ev?`<div class="ev"><b>${f.fx==="challenge"?"★ ":"! "}</b>${esc(f.ev)}</div>`:""}${body}${acts}</section>`;
}
function centerHTML(){
  const S=app.S,p=cur(S),act=canAct();
  if(S.status==="over"){
    return `<div class="mark">Spielende</div><div class="msg">${S.unranked?"Spiel abgebrochen, zählt nicht.":esc(S.ranking[0].name)+" ist Rottenberg-Baron!"}</div><div class="acts">${app.mode==="local"?`<button class="gold" data-a="rematch">🔁 Revanche!</button>`:""}<button class="${app.mode==="local"?"ghost":"gold"}" data-a="home">Zur Startseite</button></div>`;
  }
  let acts="";
  if(act){
    if(S.phase==="roll"){
      if(p.jail){acts+=`<button class="ghost" data-a="jailpay" ${p.money<50?"disabled":""}>50 zahlen</button>`;if(p.jailCards)acts+=`<button class="ghost" data-a="jailcard">Freikarte</button>`;}
      acts+=`<button class="primary" data-a="roll">${p.jail?"Pasch versuchen":"Würfeln"}</button>`;
    }else if(S.phase==="buy"){const f=BOARD[p.pos];acts+=`<button class="gold" data-a="buy">${esc(f.s.replace(/\|/g,""))} kaufen (${f.p})</button><button class="ghost" data-a="skip">Nein</button>`;}
    else if(S.phase==="challenge"&&S.challenge)acts+=soloHTML(S.challenge);
    else if(S.phase==="penalty")acts+=["links","Mitte","rechts"].map(d=>`<button class="${d==="Mitte"?"gold":"ghost"}" data-a="pen" data-d="${d}">${d[0].toUpperCase()+d.slice(1)}</button>`).join("");
    else if(S.phase==="end")acts+=`<button class="primary ${autoEndOk()?"autoend":""}" data-a="end">${autoEndOk()?"Weiter ▸":"Zug beenden"}</button>`;
    if(canDuel(S))acts+=`<button class="gold" data-a="duel-open">⚔ Herausfordern</button>`;
    if((S.phase==="roll"||S.phase==="end")&&others(S,p).length)acts+=`<button class="ghost" data-a="trade-open">🏛️ Tauschen</button>`;
  }else if(S.phase==="trade"&&S.trade){
    const B=S.players[S.trade.to];
    acts=mayAct([B.id])?`<button class="gold" data-a="trade-yes">${esc(B.name)}: Annehmen</button><button class="ghost" data-a="trade-no">Ablehnen</button>`:`<div class="note">Warte auf ${esc(B.name)} …</div>`;
  }else if(S.phase==="duel"&&S.duel){
    const d=S.duel,A=S.players[d.from],B=S.players[d.to];
    if(d.state==="ask")acts=mayAct([d.to])?`<button class="gold" data-a="duel-yes">${esc(B.name)}: Annehmen</button><button class="ghost" data-a="duel-no">Kneifen (10 €)</button>`:`<div class="note">Warte auf ${esc(B.name)} …</div>`;
    else if(d.state==="play")acts=miniHTML(d);
    else acts=mayAct([d.from,d.to])?`<button class="gold" data-a="duel-win" data-w="${A.id}">${esc(A.name)}</button><button class="gold" data-a="duel-win" data-w="${B.id}">${esc(B.name)}</button><button class="ghost" data-a="duel-win" data-w="">Unentschieden</button>`:`<div class="note">${esc(A.name)} und ${esc(B.name)} duellieren sich …</div>`;
  }else{
    acts=`<div class="note waitturn"><span class="avatar" style="background:${p.color}">${tokSvg(tokOf(p))}</span>${p.cpu?"🤖 "+esc(p.name)+" "+["überlegt","rechnet","grübelt","zählt sein Geld"][(S.lc||0)%4]:esc(p.name)+" ist dran"} …</div>`;
  }
  const q=S.card?"":quipFor(S),card=S.card?`<div class="card ${S.card.deck}"><b>${esc(S.card.t)}</b>${esc(S.card.x)}</div>`:`<div class="msg">${esc(S.log[0]||"")}</div>${q?`<div class="quip">„${esc(q)}“</div>`:""}`;
  return `<div class="wm" aria-hidden="true">${WAPPEN}</div><div class="crest">${WAPPEN}</div><div class="mark">Rottenberg<small>Runde ${S.round}${S.maxRounds?" von "+S.maxRounds:""} · Kasse ${fmt(S.pot)} €</small></div>
   <div class="turnchip"><span class="avatar" style="background:${p.color}">${tokSvg(tokOf(p))}</span>${esc(p.name)}${p.jail?" · Bunker":""}</div>
   ${S.dice[0]?`<div class="dice" id="dice"><span>${DICE[S.dice[0]]}</span><span>${DICE[S.dice[1]]}</span></div>`:""}
   ${card}<div class="acts">${acts}</div>`;
}
let mg=null;
function miniPending(d){return [d.from,d.to].filter(id=>!(d.in&&id in d.in));}
const INK=[["ROT","#e0453a"],["GRÜN","#3fae5a"],["BLAU","#4a8bf0"],["GELB","#f0c419"]];
function mathQ(){const t=Math.floor(Math.random()*3);let a,b,r,txt;
  if(t===0){a=2+Math.floor(Math.random()*48);b=2+Math.floor(Math.random()*48);r=a+b;txt=a+" + "+b;}
  else if(t===1){a=10+Math.floor(Math.random()*60);b=2+Math.floor(Math.random()*(a-2));r=a-b;txt=a+" − "+b;}
  else{a=2+Math.floor(Math.random()*11);b=2+Math.floor(Math.random()*11);r=a*b;txt=a+" × "+b;}
  const o=new Set([r]);while(o.size<3){const x=r+(Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*10));if(x>=0)o.add(x);}
  return {t:txt,a:r,opts:shuffle([...o])};}
function newInk(m){m.word=Math.floor(Math.random()*4);m.ink=Math.random()<.75?(m.word+1+Math.floor(Math.random()*3))%4:m.word;}
function nextBoar(m){m.hole=newHole(m.hole);const r=Math.random();m.ht=r<.14?"gold":r<.3?"freddy":"boar";m.next=performance.now()+(m.ht==="gold"?520:Math.max(480,850-m.count*25));}
/* Richtig +1, falsch −1, jede 5er-Serie gibt einen Bonuspunkt. */
function scoreAns(m,ok,b){if(ok){m.score++;m.streak++;if(m.streak>=15)unlock("serie");if(m.streak%5===0){m.score++;floatTxt(b,"🔥 +2");buzz([20,30,20]);}else{floatTxt(b,"+1");buzz(12);}}else{m.score--;m.streak=0;floatTxt(b,"−1",true);buzz([60,40,60]);}}
function floatTxt(b,t,bad){const r=b.getBoundingClientRect(),el=document.createElement("div");el.className="mgfloat"+(bad?" bad":"");el.textContent=t;el.style.left=(r.left+r.width/2)+"px";el.style.top=(r.top)+"px";document.body.appendChild(el);setTimeout(()=>el.remove(),700);}
function newHole(h){let x;do{x=Math.floor(Math.random()*9)}while(x===h);return x;}
const leftS=m=>Math.max(0,Math.ceil((m.end-performance.now())/1000))+" s";
function mgBegin(ctx,pid,kind,q){
  if(mg){clearInterval(mg.iv);clearTimeout(mg.to);clearInterval(mg.to);}
  const m=mg={ctx,pid,kind,q,stage:"ready",count:0,score:0,streak:0};
  if(kind==="schaetz"||kind==="ssp"||kind==="huetchen"||kind==="tap"||kind==="reflex"){mgInit(m);render();return;}
  /* 3-2-1-Los: alle starten gleich vorbereitet, niemand wird überrumpelt. */
  m.stage="count";m.cd=3;render();buzz(20);
  m.to=setInterval(()=>{if(mg!==m){clearInterval(m.to);return;}m.cd--;if(m.cd>0){mgRefresh();buzz(20);}else{clearInterval(m.to);m.to=null;buzz(60);mgInit(m);mgRefresh();}},650);
}
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}sfx(Array.isArray(p)?(p[0]>=60?"miss":"ach"):p===20?"tick":p>=60?"go":"hit");}
function mgInit(m){
  const kind=m.kind,q=m.q,now=performance.now();m.stage="ready";
  if(kind==="reflex"){m.stage="wait";m.to=setTimeout(()=>{if(mg===m){m.stage="go";m.t0=performance.now();mgRefresh();}},1500+Math.random()*3000);}
  if(kind==="whack"){m.stage="go";m.end=now+12000;m.hole=newHole(-1);m.ht="boar";m.next=now+800;}
  if(kind==="stopp"){m.stage="go";m.t0=now;}
  if(kind==="rechnen"){m.stage="go";m.end=now+20000;m.pq=mathQ();}
  if(kind==="farben"){m.stage="go";m.end=now+15000;newInk(m);}
  if(kind==="rennen"){m.stage="go";m.end=now+7000;m.last=null;}
  if(kind==="faengt"){m.stage="go";m.end=now+12000;m.nextA=now+300;m.aid=0;}
  if(kind==="glocken"){let x=q||(1+Math.floor(Math.random()*1e6));m.rng=()=>(x=(x*16807)%2147483647)%4;m.seq=[m.rng(),m.rng()];m.round=0;startBells(m);}
  if(["whack","stopp","rechnen","farben","rennen","faengt"].includes(kind))m.iv=setInterval(()=>mgTick(m),80);
}
function mgTick(m){
  if(mg!==m){clearInterval(m.iv);return;}const now=performance.now();
  if(m.kind==="stopp"){const t=now-m.t0,el=document.getElementById("mg-clock");if(el)el.textContent=t<1500?(t/1000).toFixed(2).replace(".",","):"?,??";if(t>15000)miniSubmit(Math.round(t));return;}
  if(now>=m.end){miniSubmit(["whack","rennen","faengt"].includes(m.kind)?m.count:m.score);return;}
  const l=document.getElementById("mg-left");if(l)l.textContent=leftS(m);
  if(m.kind==="faengt"&&now>=m.nextA){m.nextA=now+Math.max(330,620-m.count*18);dropApple(m);}
  if(m.kind==="whack"&&now>=m.next){nextBoar(m);mgRefresh();}
}
function dropApple(m){
  const box=document.getElementById("mg-tree");if(!box)return;const b=document.createElement("button");
  b.className="apple";b.dataset.a="mg-apple";b.textContent=Math.random()<.15?"🍐":"🍎";b.style.left=(6+Math.random()*80)+"%";
  const dur=Math.max(1.05,1.9-m.count*.04);b.style.animationDuration=dur+"s";b.setAttribute("aria-label","Äppler fangen");
  b.addEventListener("animationend",()=>{b.remove();const r=document.getElementById("mg-tree");if(r&&mg===m){r.classList.remove("splat");void r.offsetWidth;r.classList.add("splat");}});
  box.appendChild(b);
}
function startBells(m){
  m.stage="show";m.pos=0;mgRefresh();let k=0;
  const step=()=>{if(mg!==m)return;if(k>=m.seq.length){m.stage="input";m.pos=0;mgRefresh();return;}
    flashBell(m.seq[k]);k++;m.to=setTimeout(step,Math.max(330,560-m.round*25));};
  m.to=setTimeout(step,650);
}
const BELLS=[["#e0453a","Rot"],["#3fae5a","Grün"],["#4a8bf0","Blau"],["#f0c419","Gelb"]];
function flashBell(i){const el=document.querySelector(`[data-a="mg-bell"][data-v="${i}"]`);if(!el)return;el.classList.remove("ring");void el.offsetWidth;el.classList.add("ring");try{navigator.vibrate&&navigator.vibrate(25);}catch(e){}sfx("bell",i);}
function mgRefresh(){const el=document.getElementById("mg-area");if(el&&mg)el.innerHTML=mgBody();}
function mgBody(){
  const m=mg,k=m.kind;
  if(m.stage==="count")return `<div class="countdown"><span>${m.cd}</span><small>${esc(KIND_N(k))} · Rekord: ${bestText(k)}</small></div>`;
  if(k==="ssp")return `<div class="acts">${[["schere","✌️ Schere"],["stein","✊ Stein"],["papier","✋ Papier"]].map(([v,l])=>`<button class="gold" data-a="mg-pick" data-v="${v}">${l}</button>`).join("")}</div>`;
  if(k==="huetchen")return `<div class="acts">${[1,2,3].map(v=>`<button class="gold" data-a="mg-pick" data-v="${v}" style="font-size:24px;padding:10px 14px">🍺<small style="font-size:12px"> ${v}</small></button>`).join("")}</div>`;
  if(k==="schaetz")return `<div class="row" style="justify-content:center"><input id="mg-num" type="number" inputmode="numeric" style="width:8em"><button class="gold" data-a="mg-send">Tipp abgeben</button></div>`;
  if(k==="reflex")return m.stage==="go"?`<button class="primary" data-a="mg-hit" style="font-size:24px;padding:16px 24px">🐗 JETZT!</button>`:`<button class="ghost" data-a="mg-hit" style="padding:16px 24px">Warte auf die Wildsau …</button>`;
  if(k==="tap")return `<button class="gold" data-a="mg-tap" style="font-size:22px;padding:18px 26px">🍎 Pumpen! <span id="mg-count">${m.count}</span></button><div class="note" id="mg-time">${m.stage==="go"?"Läuft …":"Die Zeit startet beim ersten Tippen."}</div>`;
  if(k==="rennen"){const pct=Math.min(100,m.count*1.6);return `<div class="track"><span class="flag">🏁</span><span class="runner" style="left:calc(${pct}% - ${pct*.28}px)">🐗</span></div><div class="feet"><button class="gold ${m.last==="L"?"used":""}" data-a="mg-foot" data-v="L">👣 LINKS</button><button class="gold ${m.last==="R"?"used":""}" data-a="mg-foot" data-v="R">RECHTS 👣</button></div><div class="note">Schritte: <b id="mg-score">${m.count}</b> · noch <span id="mg-left">${leftS(m)}</span></div>`;}
  if(k==="faengt")return `<div class="tree" id="mg-tree"><span class="crown">🌳</span></div><div class="note">Gefangen: <b id="mg-score">${m.count}</b> · noch <span id="mg-left">${leftS(m)}</span></div>`;
  if(k==="glocken")return `<div class="bells">${BELLS.map((c,i)=>`<button data-a="mg-bell" data-v="${i}" style="--bell:${c[0]}" aria-label="Glocke ${c[1]}" ${m.stage!=="input"?"disabled":""}>🔔</button>`).join("")}</div><div class="note">${m.stage==="input"?"Jetzt du! ":"Hör gut zu … "}Runde <b>${m.round+1}</b> · ${m.seq.length} Töne</div>`;
  if(k==="whack")return `<div class="whack">${[...Array(9)].map((_,h)=>`<button data-a="mg-whack" data-h="${h}" class="${h===m.hole?"boar "+m.ht:""}" aria-label="Loch ${h+1}">${h===m.hole?(m.ht==="freddy"?"🧔":"🐗"):""}</button>`).join("")}</div><div class="note">🐗 +1 · goldene 🐗 +3 · 🧔 Freddy −2 · <b>${m.count}</b> Pkt · <span id="mg-left">${leftS(m)}</span></div>`;
  if(k==="stopp")return `<div class="bigq" id="mg-clock">0,00</div><button class="primary" data-a="mg-stop" style="font-size:20px;padding:12px 26px">⏱️ Stopp!</button>`;
  if(k==="rechnen")return `<div class="bigq">${m.pq.t} = ?</div><div class="acts">${m.pq.opts.map(v=>`<button class="gold" data-a="mg-ans" data-v="${v}" style="min-width:64px;font-size:18px">${v}</button>`).join("")}</div><div class="note">Punkte: <b>${m.score}</b>${m.streak>=2?` · 🔥 ${m.streak}er-Serie`:""} · noch <span id="mg-left">${leftS(m)}</span></div>`;
  if(k==="farben")return `<div class="bigq" style="color:${INK[m.ink][1]}">${INK[m.word][0]}</div><div class="acts">${INK.map((c,i)=>`<button class="ghost" data-a="mg-ink" data-v="${i}">${c[0]}</button>`).join("")}</div><div class="note">Punkte: <b>${m.score}</b>${m.streak>=2?` · 🔥 ${m.streak}er-Serie`:""} · noch <span id="mg-left">${leftS(m)}</span></div>`;
  return "";
}
function miniHTML(d){
  const S=app.S,pend=miniPending(d),mine=pend.filter(id=>app.mode==="local"?!S.players[id].cpu:S.players[id].uid===app.uid);

function watchGame(code){
  if(unsubGame)unsubGame();resetFx();app.code=code;app.mode="online";app.lobby=null;app.S=null;store.set("rbm-online",code);watchChat(code);
  unsubGame=app.db.doc("games/"+code).onSnapshot(snap=>{
    if(!snap.exists){app.err="Spiel "+code+" gibt es nicht.";store.del("rbm-online");if(unsubGame)unsubGame();unsubGame=null;app.screen="join";render();return;}
    const d=snap.data();
    if(d.status==="lobby"){app.lobby=d;if(app.screen!=="lobby")app.screen="lobby";render();return;}
    if(app.S&&(app.S.rev||0)>(d.rev||0))return;

    app.S=JSON.parse(JSON.stringify(d));if(app.screen!=="game")app.screen="game";

}
async function withLease(ref,fn){
  const holder=(app.uid||"x")+"-"+Math.random().toString(36).slice(2);
  for(let k=0;k<14;k++){const l=await ref.acquire({holder,ttlMs:2500});if(l.acquired){try{return await fn();}finally{ref.release&&ref.release(holder);}}await new Promise(r=>setTimeout(r,180+Math.random()*220));}
  throw {code:"busy"};
}

function mgFast(a,b){
  switch(a){
    case "mg-foot":if(mg&&mg.kind==="rennen"&&mg.stage==="go"){const v=b.dataset.v;if(v!==mg.last){mg.count++;mg.last=v;}else{mg.count=Math.max(0,mg.count-1);}
      const r=document.querySelector(".track .runner"),pct=Math.min(100,mg.count*1.6);if(r)r.style.left=`calc(${pct}% - ${pct*.28}px)`;
      document.querySelectorAll('[data-a="mg-foot"]').forEach(x=>x.classList.toggle("used",x.dataset.v===mg.last));const sc=document.getElementById("mg-score");if(sc)sc.textContent=mg.count;}break;
    case "mg-apple":if(mg&&mg.kind==="faengt"){mg.count++;b.classList.add("caught");b.dataset.a="";b.textContent="✨";setTimeout(()=>b.remove(),250);const sc=document.getElementById("mg-score");if(sc)sc.textContent=mg.count;buzz(15);}break;
    case "mg-bell":if(mg&&mg.kind==="glocken"&&mg.stage==="input"){const v=+b.dataset.v;flashBell(v);
      if(v!==mg.seq[mg.pos]){const m=mg;m.stage="done";sfx("miss");b.classList.add("wrong");setTimeout(()=>{if(mg===m)miniSubmit(m.round);},500);break;}
      mg.pos++;if(mg.pos>=mg.seq.length){mg.round++;mg.seq.push(mg.rng());const m=mg;m.stage="show";setTimeout(()=>{if(mg===m)startBells(m);},350);mgRefresh();}}break;
    case "mg-whack":if(mg&&mg.kind==="whack"&&mg.stage==="go"&&+b.dataset.h===mg.hole){const t=mg.ht;mg.count=Math.max(0,mg.count+(t==="gold"?3:t==="freddy"?-2:1));buzz(t==="freddy"?[60,40,60]:15);floatTxt(b,t==="gold"?"+3":t==="freddy"?"−2":"+1",t==="freddy");nextBoar(mg);mgRefresh();}break;
    case "mg-stop":if(mg&&mg.kind==="stopp"&&mg.stage==="go")miniSubmit(Math.round(performance.now()-mg.t0));break;
    case "mg-ans":if(mg&&mg.kind==="rechnen"&&mg.stage==="go"){scoreAns(mg,+b.dataset.v===mg.pq.a,b);mg.pq=mathQ();mgRefresh();}break;
    case "mg-ink":if(mg&&mg.kind==="farben"&&mg.stage==="go"){scoreAns(mg,+b.dataset.v===mg.ink,b);newInk(mg);mgRefresh();}break;
    case "mg-hit":if(mg){if(mg.stage==="go")miniSubmit(Math.round(performance.now()-mg.t0));else{toast("Zu früh! 5 Sekunden Strafe.");miniSubmit(5000);}}break;
    case "mg-tap":if(mg){mg.count++;const c=document.getElementById("mg-count");if(c)c.textContent=mg.count;
      if(mg.stage==="ready"){mg.stage="go";const m=mg;const tEl=document.getElementById("mg-time");if(tEl)tEl.textContent="Läuft …";setTimeout(()=>{if(mg===m)miniSubmit(m.count);},5000);}}break;
  }
}

document.getElementById("stickers").innerHTML=Object.entries(STICKERS).map(([k,v])=>`<button type="button" data-a="sticker" data-s="${k}">${v[0]} ${esc(v[1])}</button>`).join("")+`<button type="button" data-a="spruch">🎤 Zufallsspruch</button>`;
function myName(){const S=app.S||app.lobby;const me=S&&S.players.find(p=>p.uid===app.uid);return me?me.name:(store.get("rbm-me")||"Jemand");}
function myColor(){const S=app.S||app.lobby;const i=S?S.players.findIndex(p=>p.uid===app.uid):-1;return COLORS[i]||"var(--paper)";}
async function sendChat(m){
  if(!app.db||!app.code)return;
  try{await app.db.collection("games/"+app.code+"/chat").add(Object.assign({uid:app.uid,name:myName(),color:myColor(),at:Date.now()},m));}
  catch(e){toast("Nachricht ging nicht raus ("+(e&&e.code||"Fehler")+").");}
}
function watchChat(code){
  if(unsubChat)unsubChat();chatMsgs=[];chatSeen=Date.now();renderChat();
  unsubChat=app.db.collection("games/"+code+"/chat").orderBy("at","desc").limit(60).onSnapshot(s=>{
    chatMsgs=s.docs.map(d=>d.data()).reverse();
    const fresh=chatMsgs.filter(m=>m.at>chatSeen&&m.uid!==app.uid);
    if(fresh.length){const m=fresh[fresh.length-1];toast(m.name+": "+(m.kind==="sticker"&&STICKERS[m.s]?STICKERS[m.s][0]+" "+STICKERS[m.s][1]:String(m.text||"").slice(0,80)));}
    if(chatMsgs.length)chatSeen=Math.max(chatSeen,chatMsgs[chatMsgs.length-1].at);
    renderChat();
  },()=>{});
}
function stopChat(){if(unsubChat){unsubChat();unsubChat=null;}chatMsgs=[];renderChat();}
function renderChat(){
  const show=app.mode==="online"&&!!app.code&&(app.screen==="game"||app.screen==="lobby")&&!!app.db;
  document.getElementById("chatwrap").hidden=!show;if(!show)return;
  document.getElementById("chatinfo").textContent="Spiel "+app.code;
  const box=document.getElementById("msgs");
  if(!chatMsgs.length){box.innerHTML=`<p class="note">Noch ist es still im Dorf. Schreib was oder schick einen Sticker.</p>`;return;}
  const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<40;
  box.innerHTML=chatMsgs.map(m=>{
    const me=m.uid===app.uid,who=`<div class="who"><span class="dot" style="background:${esc(m.color||"#ccc")};width:8px;height:8px"></span>${esc(m.name||"Jemand")}</div>`;
    if(m.kind==="sticker"&&STICKERS[m.s])return `<div class="m st ${me?"me":""}">${who}<span class="big">${STICKERS[m.s][0]}</span><span class="lbl">${esc(STICKERS[m.s][1])}</span></div>`;
    return `<div class="m ${m.kind==="spruch"?"sp":""} ${me?"me":""}">${who}${esc(m.text||"")}</div>`;
  }).join("");
  if(atBottom||box.dataset.init!=="1"){box.scrollTop=box.scrollHeight;box.dataset.init="1";}
}
document.getElementById("chatform").addEventListener("submit",e=>{e.preventDefault();const el=document.getElementById("chatmsg");const t=el.value.trim();if(!t)return;el.value="";sendChat({kind:"text",text:t.slice(0,200)});});

/* ---------- Start ---------- */
function start(data){
  if(data&&data.screen){Object.assign(app,{screen:data.screen,mode:data.mode,S:data.S,code:data.code});if(data.mode==="online")app.screen="home";}
  app.results=mergeResults();render();
  window.claude?.hot?.snapshot?.(()=>({screen:app.screen,mode:app.mode,S:app.S,code:app.code}));
  (async()=>{
    if(!window.claude||!window.claude.use)return;
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    app.user=user;app.uid=user?await user.id():null;app.db=db;
    if(db){db.collection("results").orderBy("at","desc").limit(300).onSnapshot(s=>{remoteResults=s.docs.map(d=>Object.assign({id:d.id},d.data()));app.results=remoteResults;if(app.screen==="home"||(app.S&&app.S.status==="over"))render();},()=>{});}
    if(app.screen==="home")render();
  })();
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

<script>if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
